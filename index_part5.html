    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime(freq = 523.25, type = 'sine') {
      if (!App.voiceEnabled) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.6);
      } catch (e) { console.log(e); }
    }

    function speakText(enText, urText) {
      if (!App.voiceEnabled) return;
      playChime(659.25);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance();
        if (App.lang === 'ur' && urText) {
          utterance.text = urText;
          utterance.lang = 'ur-PK';
        } else {
          utterance.text = enText || urText;
          utterance.lang = 'en-US';
        }
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      }
    }

    let canvas, ctx, isDrawing = false;
    function initTraceCanvas() {
      canvas = document.getElementById('traceCanvas');
      if (!canvas) return;
      ctx = canvas.getContext('2d');
      ctx.lineWidth = 14;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = '#7BC96F';
      drawTraceGuides('line');

      function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      canvas.onmousedown = canvas.ontouchstart = (e) => {
        isDrawing = true;
        const p = getPos(e);
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
      };
      canvas.onmousemove = canvas.ontouchmove = (e) => {
        if (!isDrawing) return;
        const p = getPos(e);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
      };
      canvas.onmouseup = canvas.ontouchend = () => { isDrawing = false; };
    }

    function setTraceColor(c) {
      if (ctx) ctx.strokeStyle = c;
    }

    function clearTraceCanvas() {
      if (canvas && ctx) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawTraceGuides('line');
      }
    }

    function setTracePattern(pattern) {
      clearTraceCanvas();
      drawTraceGuides(pattern);
    }

    function drawTraceGuides(pattern) {
      if (!ctx) return;
      ctx.save();
      ctx.strokeStyle = '#D1D5DB';
      ctx.setLineDash([8, 8]);
      ctx.lineWidth = 4;
      ctx.beginPath();
      if (pattern === 'line') {
        ctx.moveTo(80, 160);
        ctx.lineTo(520, 160);
      } else if (pattern === 'curve') {
        ctx.moveTo(80, 160);
        ctx.bezierCurveTo(200, 60, 380, 260, 520, 160);
      } else if (pattern === 'alif') {
        ctx.moveTo(300, 60);
        ctx.lineTo(300, 240);
      } else if (pattern === 'letterA') {
        ctx.moveTo(300, 60);
        ctx.lineTo(200, 240);
        ctx.moveTo(300, 60);
        ctx.lineTo(400, 240);
        ctx.moveTo(240, 160);
        ctx.lineTo(360, 160);
      }
      ctx.stroke();
      ctx.restore();
    }

          qHtml += '</div></div>';
        });
        document.getElementById('story-quiz-container').innerHTML = qHtml;
      }
    }

    function playCurrentStoryPageAudio(slow) {
      const s = storiesData.find(x => x.id === App.currentStoryId);
      if (!s || App.currentStoryPage > 5) return;
      const p = s.pages[App.currentStoryPage - 1];
      speakText(p.en, p.ur);
    }

    function nextStoryPage() {
      if (App.currentStoryPage < 6) {
        App.currentStoryPage++;
        renderStoryPage();
        playChime(600);
      } else {
        closeStoryReader();
        earnStar('Story Reader');
      }
    }

    function prevStoryPage() {
      if (App.currentStoryPage > 1) {
        App.currentStoryPage--;
        renderStoryPage();
        playChime(400);
      }
    }

    function answerStoryQuiz(correct) {
      if (correct) {
        earnStar('Story Quiz Master');
        alert('Wonderful! Correct answer! (+1 ⭐)');
      } else {
        playChime(300);
        alert('Good try! Let us look again!');
      }
    }

    function openParentModal() {
      document.getElementById('parent-modal').classList.remove('hidden');
      document.getElementById('pin-section').classList.remove('hidden');
      document.getElementById('parent-tools-section').classList.add('hidden');
      document.getElementById('parent-pin-input').value = '';
    }
    function closeParentModal() {
      document.getElementById('parent-modal').classList.add('hidden');
    }
    function verifyParentPin() {
      const pin = document.getElementById('parent-pin-input').value;
      if (pin === '1234') {
        document.getElementById('pin-section').classList.add('hidden');
        document.getElementById('parent-tools-section').classList.remove('hidden');
        playChime(700);
      } else {
        alert('Incorrect PIN. Please enter 1234.');
      }
    }
    function setTimerDuration(m) {
      App.timerSeconds = m * 60;
      App.timerTotalSeconds = m * 60;
      updateTimerUI();
      alert('Screen timer updated to ' + m + ' minutes!');
      closeParentModal();
    }

    function askKaliHelper() {
      const q = document.getElementById('rag-query').value.toLowerCase();
      const ansBox = document.getElementById('rag-answer');
      ansBox.classList.remove('hidden');
      if (q.includes('pencil') || q.includes('grip') || q.includes('crayon') || q.includes('hold')) {
        ansBox.innerHTML = '<strong>Kali Helper:</strong> For a child struggling with pencil grip, avoid forcing a full pencil. Start with broken chunky crayons or playdough pinch rolls. Visit our <em>Fine Motor Skills</em> section with Bheeni the Bee!';
      } else if (q.includes('share') || q.includes('sharing') || q.includes('cry')) {
        ansBox.innerHTML = '<strong>Kali Helper:</strong> Sharing at age 3 is developmental. Read our story <em>Kali Shares Her Water Drop</em> together and play the turn-taking biscuit game recommended in the story activity!';
      } else {
        ansBox.innerHTML = '<strong>Kali Helper:</strong> Remember: for young children, 20 minutes of playful learning followed by hands-on household play builds the strongest foundation. Explore our Daily Home Activities!';
      }
    }

    function answerMath(ans) {
      const fb = document.getElementById('math-feedback');
      fb.classList.remove('hidden');
      if (ans === 12) {
        App.mathScore += 10;
        document.getElementById('math-score').innerText = App.mathScore;
        fb.innerText = 'Spot on! 5 + 7 = 12 (+1 ⭐)';
        fb.className = 'text-xs font-bold text-pastel-green-dark';
        earnStar('Junior Math Star');
      } else {
        fb.innerText = 'Try once more! Count on your fingers.';
        fb.className = 'text-xs font-bold text-pastel-pink-dark';
      }
    }

    function simulateMicrophone() {
      const st = document.getElementById('mic-status');
      st.innerText = 'Listening to your sweet voice... 🎙️';
      playChime(600);
      setTimeout(() => {
        st.innerText = 'Mashallah! Wonderful pronunciation! (+1 ⭐)';
        earnStar('Speaking Star');
      }, 1800);
    }

    function simulatePhotoUpload() {
      const fb = document.getElementById('upload-feedback');
      fb.classList.remove('hidden');
      fb.innerText = 'Photo uploaded successfully! Teacher feedback: "Mashallah, creative little scientist!" (+3 ⭐)';
      earnStar('Home Project Master');
      earnStar('Home Project Master');
      earnStar('Home Project Master');
    }

    function openHomeActivityDetail() {
      switchTab('little');
      showLittleSub('weekly');
    }

    function playPoemAudio(poem) {
      speakText('Machli jal ki rani hai, jeevan uska paani hai! Haath lagao toh darr jayegi, baahar nikaalo toh marr jayegi!');
      earnStar('Poem Singer');
    }
  </script>
</body>
</html>
